name: Build and Deploy Cashew Store

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/cashew-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/cashew-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }}
          
      - name: Build and push frontend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Install AWS CLI
        shell: bash
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Configure kubeconfig for EKS
        shell: bash
        run: |
          aws eks update-kubeconfig --name casunet-cluster --region eu-north-1 --kubeconfig "$HOME/.kube/config"

      - name: Update image names
        shell: bash
        run: |
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-backend:latest|ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-frontend:latest|ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          export KUBECONFIG="$HOME/.kube/config"
          kubectl apply -k k8s/ --validate=false
          kubectl rollout status deployment/backend -n cashew-store --timeout=180s
          kubectl rollout status deployment/frontend -n cashew-store --timeout=180s
          kubectl get pods -n cashew-store
