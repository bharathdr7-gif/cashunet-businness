name: Build and Deploy Cashew Store

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/cashew-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/cashew-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }}
          
      - name: Build and push frontend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Install AWS CLI
        shell: bash
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip awscliv2.zip
          sudo ./aws/install --update
          which aws
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate AWS access and EKS cluster
        shell: bash
        run: |
          aws sts get-caller-identity
          aws eks describe-cluster --name "${{ secrets.AWS_EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"

      - name: Configure kubeconfig for EKS
        shell: bash
        env:
          PATH: /usr/local/bin:/usr/bin:/bin:$PATH
        run: |
          mkdir -p "$HOME/.kube"
          aws --version
          which aws
          aws eks get-token --cluster-name "${{ secrets.AWS_EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}"
          aws eks update-kubeconfig --name "${{ secrets.AWS_EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}" --kubeconfig "$HOME/.kube/config" --alias "${{ secrets.AWS_EKS_CLUSTER_NAME }}"
          kubectl --kubeconfig "$HOME/.kube/config" config view --minify
          kubectl --kubeconfig "$HOME/.kube/config" config get-contexts

      - name: Update image names
        shell: bash
        run: |
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-backend:latest|ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-frontend:latest|ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes
        shell: bash
        env:
          PATH: /usr/local/bin:/usr/bin:/bin:$PATH
        run: |
          which aws
          aws --version
          TOKEN=$(aws eks get-token --cluster-name "${{ secrets.AWS_EKS_CLUSTER_NAME }}" --region "${{ secrets.AWS_REGION }}" --output json | python3 -c 'import sys, json; print(json.load(sys.stdin)["status"]["token"])')
          kubectl --kubeconfig "$HOME/.kube/config" --token "$TOKEN" apply -k k8s/ --validate=false
          kubectl --kubeconfig "$HOME/.kube/config" --token "$TOKEN" rollout status deployment/backend -n cashew-store --timeout=180s
          kubectl --kubeconfig "$HOME/.kube/config" --token "$TOKEN" rollout status deployment/frontend -n cashew-store --timeout=180s
          kubectl --kubeconfig "$HOME/.kube/config" --token "$TOKEN" get pods -n cashew-store
