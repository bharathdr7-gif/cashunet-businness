name: Build and Deploy Cashew Store

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/cashew-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/cashew-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
        registry: docker.io
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }} ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-backend:${{ github.sha }}
          
      - name: Build and push frontend
        shell: bash
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }} ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cashew-frontend:${{ github.sha }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Update image names
        shell: bash
        run: |
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-backend:latest|ghcr.io/${{ env.BACKEND_IMAGE }}:${{ github.sha }}|g" k8s/backend-deployment.yaml
          sed -i "s|ghcr.io/YOUR_GITHUB_USER/cashew-frontend:latest|ghcr.io/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}|g" k8s/frontend-deployment.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k k8s/
          kubectl rollout status deployment/backend -n cashew-store --timeout=180s
          kubectl rollout status deployment/frontend -n cashew-store --timeout=180s
          kubectl get pods -n cashew-store
