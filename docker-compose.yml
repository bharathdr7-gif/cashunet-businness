services:
  mongodb:
    image: mongo:8
    container_name: cashew-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: cashew-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: cashew_store
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: cashew-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
